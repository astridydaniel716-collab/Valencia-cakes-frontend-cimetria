<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="../css/admin.css">

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <div class="logo-sidebar">

        <img src="./imagenes/logo-removebg-preview.png"
            alt="Valencia Cakes"
            class="logo-img">

        <button onclick="mostrarSeccion('productos')">

            Gestión de Productos

        </button>

        <button onclick="mostrarSeccion('vendedores')">

            Crear Vendedores / Cambiar Roles

        </button>

        <button onclick="mostrarSeccion('facturacion')">

            Facturación

        </button>

        <button onclick="mostrarSeccion('usuarios')">

            Usuarios

        </button>

        <button onclick="cerrarSesion()">

            Cerrar Sesión

        </button>

    </div>


    <!-- CONTENIDO -->
    <div class="contenido">

        <h2 id="titulo-seccion">

            Bienvenido
            <span id="nombre-usuario"></span> 👋

        </h2>

        <div id="panel-contenido">

            Selecciona una opción del menú

        </div>

    </div>

</div>

<script src="../js/admin.js"></script>

</body>
</html>
