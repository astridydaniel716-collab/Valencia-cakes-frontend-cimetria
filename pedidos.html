<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos | Valencia Cakes</title>
    <link rel="icon" type="icon" href="./imagenes/iconovalenciacakes.ico">
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/pedidos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    

        <!-- CONTENIDO -->
        <main class="main-content">

            <div class="top-content">

                <div>
                    <h1>Gestión de Pedidos</h1>
                    <p>Administra todos los pedidos</p>
                </div>

                <button class="btn-primary" id="btnAbrirModalPedido">
                    <i class="fa-solid fa-plus"></i>
                    Nuevo Pedido
                </button>

            </div>

            <!-- TABLA -->
            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tbodyPedidos">
                        <!-- JS -->
                    </tbody>

                </table>

            </div>

        </main>

    </div>
<!-- MODAL PEDIDO -->
<div class="modal" id="modalPedido">

    <div class="modal-content modal-lg">

        <div class="modal-header">

            <h2 id="tituloModal">Nuevo Pedido</h2>

            <button class="btn-close" id="cerrarModal">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <form id="formPedido">

            <!-- ID OCULTO (CORRECTO PARA TU JS) -->
            <input type="hidden" id="idpedido">

            <!-- CLIENTE -->
            <div class="form-group">

                <label>Cliente</label>

                <div class="cliente-row">

                    <select id="cliente_id" required>
                        <option value="">Seleccione un cliente</option>
                    </select>

                    <button type="button"
                        class="btn-secondary"
                        id="btnNuevoCliente">
                        <i class="fa-solid fa-user-plus"></i>
                    </button>

                </div>

            </div>

            <!-- ESTADO -->
            <div class="form-group">

                <label>Estado</label>

                <select id="estado">
                    <option value="pendiente">Pendiente</option>
                    <option value="preparacion">En preparación</option>
                    <option value="entregado">Entregado</option>
                    <option value="cancelado">Cancelado</option>
                </select>

            </div>

            <!-- FECHA ENTREGA -->
            <div class="form-group">

                <label>Fecha de entrega</label>
                <input type="date" id="fecha_entrega">
            </div>

            <!-- HORA ENTREGA -->
            <div class="form-group">

                <label>Hora de entrega</label>
                <input type="time" id="hora_entrega">
            </div>

            <!-- ABONO -->
            <div class="form-group">

                <label>Abono</label>
                <input type="number" id="abono" min="0">
            </div>

            <!-- METODO ENTREGA -->
            <div class="form-group">

                <label>Método de entrega</label>

                <select id="metodo_entrega">
                    <option value="domicilio">Domicilio</option>
                    <option value="recoger">Recoger en tienda</option>
                </select>

            </div>

            <!-- DIRECCION -->
            <div class="form-group">

                <label>Dirección</label>
                <input type="text" id="direccion">
            </div>

            <!-- OBSERVACIONES -->
            <div class="form-group">

                <label>Observaciones</label>
                <textarea id="observaciones"></textarea>
            </div>

            <!-- PRODUCTOS -->
            <div class="productos-header">

                <h3>Productos</h3>

                <button type="button"
                    class="btn-primary"
                    id="btnAgregarProducto">

                    <i class="fa-solid fa-plus"></i>
                    Agregar Producto

                </button>

            </div>

            <div id="contenedorProductos"></div>

            <!-- TOTAL -->
            <div class="total-container">

                <h2>
                    Total:
                    <span id="totalPedido">$0</span>
                </h2>

            </div>

            <!-- BOTONES -->
            <div class="modal-footer">

                <button type="button"
                    class="btn-secondary"
                    id="btnCancelarModal">
                    Cancelar
                </button>

                <button type="submit"
                    class="btn-primary">
                    Guardar Pedido
                </button>

            </div>

        </form>

    </div>

</div>
<!-- MODAL DETALLE -->
<div class="modal" id="modalDetalle">

    <div class="modal-content modal-lg">

        <div class="modal-header">

            <h2>Detalle Pedido</h2>

            <button class="btn-close" id="cerrarDetalle">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <div id="detallePedidoContainer"></div>

    </div>

</div>

<script src="../js/pedidos.js">

</script>
</body>
</html>
