<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos | Valencia Cakes</title>
    <link rel="icon" type="icon" href="./imagenes/iconovalenciacakes.ico">
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/pedidos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    

        <!-- CONTENIDO -->
        <main class="main-content">

            <div class="top-content">

                <div>
                    <h1>Gestión de Pedidos</h1>
                    <p>Administra todos los pedidos</p>
                </div>

                <button class="btn-primary" id="btnAbrirModalPedido">
                    <i class="fa-solid fa-plus"></i>
                    Nuevo Pedido
                </button>

            </div>

            <!-- TABLA -->
            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tbodyPedidos">
                        <!-- JS -->
                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <!-- MODAL PEDIDO -->
    <div class="modal" id="modalPedido">

        <div class="modal-content modal-lg">

            <div class="modal-header">

                <h2 id="tituloModal">
                    Nuevo Pedido
                </h2>

                <button class="btn-close" id="cerrarModal">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

            <form id="formPedido">

                <input type="hidden" id="pedidoId">

                <div class="form-group">

                    <label>Cliente</label>

                    <div class="cliente-row">

                        <select id="cliente_id" required>
                            <option value="">
                                Seleccione un cliente
                            </option>
                        </select>

                        <button type="button"
                            class="btn-secondary"
                            id="btnNuevoCliente">

                            <i class="fa-solid fa-user-plus"></i>

                        </button>

                    </div>

                </div>

                <div class="form-group">

                    <label>Estado</label>

                    <select id="estado">

                        <option value="pendiente">
                            Pendiente
                        </option>

                        <option value="preparacion">
                            En preparación
                        </option>

                        <option value="entregado">
                            Entregado
                        </option>

                        <option value="cancelado">
                            Cancelado
                        </option>

                    </select>

                </div>

                <!-- PRODUCTOS -->
                <div class="productos-header">

                    <h3>Productos</h3>

                    <button type="button"
                        class="btn-primary"
                        id="btnAgregarProducto">

                        <i class="fa-solid fa-plus"></i>
                        Agregar Producto

                    </button>

                </div>

                <div id="contenedorProductos">
                    <!-- JS -->
                </div>

                <div class="total-container">

                    <h2>
                        Total:
                        <span id="totalPedido">$0</span>
                    </h2>

                </div>

                <div class="modal-footer">

                    <button type="button"
                        class="btn-secondary"
                        id="btnCancelarModal">

                        Cancelar

                    </button>

                    <button type="submit"
                        class="btn-primary">

                        Guardar Pedido

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- MODAL DETALLE -->
    <div class="modal" id="modalDetalle">

        <div class="modal-content modal-lg">

            <div class="modal-header">

                <h2>Detalle Pedido</h2>

                <button class="btn-close"
                    id="cerrarDetalle">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>

            <div id="detallePedidoContainer">
                <!-- JS -->
            </div>

        </div>

    </div>

    <!-- MODAL NUEVO CLIENTE -->
    <div class="modal" id="modalCliente">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Nuevo Cliente</h2>

                <button class="btn-close"
                    id="cerrarModalCliente">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>

            <form id="formCliente">

                <div class="form-group">

                    <label>Nombre</label>

                    <input type="text"
                        id="clienteNombre"
                        required>

                </div>

                <div class="form-group">

                    <label>Teléfono</label>

                    <input type="text"
                        id="clienteTelefono">

                </div>

                <div class="form-group">

                    <label>Correo</label>

                    <input type="email"
                        id="clienteCorreo">

                </div>

                <div class="modal-footer">

                    <button type="submit"
                        class="btn-primary">

                        Guardar Cliente

                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="../js/pedidos.js"></script>

</body>
</html>
